name: ci

# Project CI. The Ralph Loop needs two things from it (.claude/ralph/SETUP.md): the workflow is
# named `ci` (the router's workflow_run waits for it) and the job is named config.ci_check (`test`).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pyyaml==6.0.2
      - name: Loop self-tests
        run: python -m unittest discover -s .claude/ralph/tests
      - name: Skill lint
        run: python .claude/ralph/guard.py lint
